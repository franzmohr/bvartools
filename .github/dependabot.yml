# Keeps the actions that the workflows in .github/workflows use up to date.
#
# Dependabot has no ecosystem for the R dependencies of DESCRIPTION, which are
# resolved from CRAN every time a check runs and are therefore always current,
# so the actions are all there is to update here.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # The updates arrive as a single pull request instead of one per action, so
    # that a month of updates costs one run of the checks and one notification.
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
