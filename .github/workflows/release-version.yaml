# Checks that a release tag agrees with the version in DESCRIPTION and, if the
# file is present, with the version in CITATION.cff.
#
# Between releases the two are expected to differ: DESCRIPTION carries the
# development version, while CITATION.cff describes the last version that was
# actually released and archived. The tag is the one moment where all of them
# have to say the same thing, because the snapshot at the tag is what is
# published and what Zenodo archives, so this runs on tags alone.
#
# A pre-release suffix is ignored, so that the tag v1.3.0-rc1 is checked against
# the version 1.3.0, which is what DESCRIPTION can express.
on:
  push:
    tags:
      - "v*"

name: release-version

permissions: read-all

jobs:
  release-version:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag, DESCRIPTION and CITATION.cff agree
        run: |
          set -euo pipefail

          # The leading 'v' and any pre-release suffix are not part of the
          # version that the files carry
          tag=${GITHUB_REF_NAME#v}
          tag=${tag%%-*}

          read_field() {
            sed -n "s/^$2:[[:space:]]*//p" "$1" | head -1 | tr -d "\"'" | tr -d '[:space:]'
          }

          if [ ! -f DESCRIPTION ]; then
            echo "::error::There is no DESCRIPTION to check the tag against."
            exit 1
          fi

          description=$(read_field DESCRIPTION Version)
          echo "tag:          $tag"
          echo "DESCRIPTION:  $description"

          status=0
          if [ "$description" != "$tag" ]; then
            echo "::error file=DESCRIPTION::DESCRIPTION is at $description, but the tag says $tag."
            status=1
          fi

          if [ -f CITATION.cff ]; then
            citation=$(read_field CITATION.cff version)
            echo "CITATION.cff: $citation"
            if [ "$citation" != "$tag" ]; then
              echo "::error file=CITATION.cff::CITATION.cff is at $citation, but the tag says $tag. It has to name the version that is being released, because Zenodo takes its metadata from the snapshot at the tag."
              status=1
            fi
          else
            echo "CITATION.cff: absent, nothing to compare."
          fi

          if [ "$status" -eq 0 ]; then
            echo "The tag, DESCRIPTION and CITATION.cff agree on $tag."
          fi

          exit $status
