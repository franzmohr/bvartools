url: https://franzmohr.github.io/bvartools/

template:
  bootstrap: 5

home:
  title: "bvartools: Bayesian VAR and VEC Models in R"
  description: >
    Bayesian inference of vector autoregressive and error correction models,
    including stochastic volatility, time varying parameters, variable
    selection, sign restrictions and quantile VARs.

reference:
- title: Model set-up
  contents:
  - create_bvarmodel
  - create_bvecmodel
  - starts_with("use_expanding_window")
  - combine_models
  - starts_with("align_model_obs")
  - transform_variables
  - starts_with("window.")
  - generate_artificial_var
  - generate_artificial_vec

- title: Priors and initial values
